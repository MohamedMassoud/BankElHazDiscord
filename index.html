<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efe3c8">
<title>بنك الحظ</title>
<link rel="stylesheet" href="assets/fonts.css">
<script src="assets/img-map.js"></script>
<style id="css-classic">

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff1a8;--card:#fffdf0;--tx:#2b2200;--mut:#6b5d1a;--ac:#c8102e;--bd:#2b2200;--btn:#c8102e;--btx:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a0a;--card:#2a2610;--tx:#fff4c9;--mut:#cdbf7a;--ac:#ff6b7d;--bd:#fff4c9;--btn:#ff6b7d;--btx:#1d1a0a}}
:root[data-theme="dark"]{--bg:#1d1a0a;--card:#2a2610;--tx:#fff4c9;--mut:#cdbf7a;--ac:#ff6b7d;--bd:#fff4c9;--btn:#ff6b7d;--btx:#1d1a0a}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;padding:10px;max-width:720px;margin:auto}
h1{margin:4px 0 8px;font-size:1.5rem;color:var(--ac);text-align:center}
.board{direction:ltr;display:grid;grid-template-columns:1.5fr repeat(9,1fr) 1.5fr;grid-template-rows:1.5fr repeat(9,1fr) 1.5fr;aspect-ratio:1;border:2px solid var(--bd);background:var(--card);gap:1px}
.sq{direction:var(--txtdir,rtl);position:relative;border:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:clamp(5.5px,1.55vw,10px);line-height:1.15;overflow:hidden;background:var(--card);padding:1px}
.sq i{display:block;width:100%;height:20%;min-height:3px;position:absolute;top:0;left:0}
.sq b{font-size:1.3em}
.tk{display:flex;flex-wrap:wrap;gap:1px;justify-content:center;position:absolute;bottom:1px}
.tk u{width:clamp(6px,1.9vw,12px);height:clamp(6px,1.9vw,12px);border-radius:50%;border:1px solid #fff;display:block}
.mid{grid-area:2/2/11/11;direction:var(--txtdir,rtl);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:6px;background:repeating-linear-gradient(45deg,transparent 0 12px,rgba(200,16,46,.06) 12px 24px)}
.mid .t{font-size:clamp(18px,6vw,38px);font-weight:800;color:var(--ac)}
.dice{font-size:clamp(30px,10vw,64px);letter-spacing:6px}
.log{font-size:clamp(10px,2.6vw,14px);color:var(--mut);min-height:3em}
.panel{background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:10px;margin-top:10px}
button{font:inherit;background:var(--btn);color:var(--btx);border:0;border-radius:10px;padding:10px 16px;margin:3px;cursor:pointer;font-weight:700}
button.s{background:transparent;color:var(--tx);border:2px solid var(--bd)}
button.s.off{opacity:.45}
button:disabled{opacity:.5}
input{font:inherit;padding:9px;border-radius:10px;border:2px solid var(--bd);background:var(--card);color:var(--tx)}
.pl{display:flex;align-items:center;gap:8px;padding:4px 0}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.me{font-weight:800}
h1{background:linear-gradient(90deg,var(--ac),#f4a300,var(--ac));background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite}
@keyframes sh{to{background-position:200%}}
.mid .t{animation:glow 2.5s ease-in-out infinite}
@keyframes glow{50%{text-shadow:0 0 14px var(--ac);transform:scale(1.05)}}
.dice.roll{animation:roll .8s cubic-bezier(.2,.8,.3,1)}
@keyframes roll{0%{transform:rotate(0) scale(.3) translateY(-40px);opacity:.2}60%{transform:rotate(540deg) scale(1.35)}100%{transform:rotate(720deg) scale(1);opacity:1}}
.sq.pop{animation:pop .7s;z-index:2}
@keyframes pop{30%{transform:scale(1.4);box-shadow:0 0 14px 4px #f4a300}}
.sq.nw{animation:nw 1.1s}
@keyframes nw{0%{filter:brightness(2.4) saturate(2)}100%{filter:none}}
.tk u.cur{animation:pl 1s ease-in-out infinite}
@keyframes pl{50%{transform:scale(1.7)}}
.shake{animation:shk .5s}
@keyframes shk{20%{transform:translateX(-8px) rotate(-.6deg)}40%{transform:translateX(8px) rotate(.6deg)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.fl{margin-inline-start:auto;animation:fl 1.6s forwards}
.fl.up{color:#2a9d4f}.fl.dn{color:#e63946}
@keyframes fl{0%{opacity:0;transform:translateY(10px)}15%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translate(-50%,-150%);background:var(--btn);color:var(--btx);padding:10px 18px;border-radius:999px;font-weight:700;z-index:50;max-width:92vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.3);pointer-events:none}
#toast.on{animation:tt 3s forwards}
@keyframes tt{10%,85%{transform:translate(-50%,0)}100%{transform:translate(-50%,-150%)}}
.cf{position:fixed;top:-20px;width:10px;height:14px;z-index:60;animation:cf linear forwards;pointer-events:none}
@keyframes cf{to{transform:translateY(110vh) rotate(720deg)}}
button{transition:transform .1s}button:active{transform:scale(.93)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
small{color:var(--mut)}
.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55;z-index:0}
.sq b,.sq span,.sq small{position:relative;z-index:1}
.sq i{z-index:1}
.tk{z-index:2}
.sq span,.sq small{font-weight:700;text-shadow:0 0 3px var(--card),0 0 3px var(--card),0 0 5px var(--card)}
.hero{width:100%;height:clamp(110px,30vw,200px);object-fit:cover;border-radius:10px;border:2px solid var(--bd);margin-bottom:6px;background:var(--card)}
svg.hero{height:auto;max-height:260px}
.pcard{display:flex;align-items:center;gap:8px;font-weight:700;font-size:clamp(10px,2.8vw,15px);max-width:100%}
.pcard img{height:clamp(34px,12vw,84px);max-width:46vw;object-fit:cover;border-radius:8px;border:2px solid var(--bd)}
/* ===== v3: responsive layout, 48-square board, ownership UI ===== */
html{-webkit-text-size-adjust:100%}
body{max-width:1100px;padding:8px;min-height:100dvh;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
h1{font-size:clamp(1.1rem,4.5vw,1.6rem)}
button{min-height:46px;font-size:16px}
input{font-size:16px;min-height:44px;max-width:100%}
input[type=number]{width:110px}
.board{grid-template-columns:1.5fr repeat(11,1fr) 1.5fr;grid-template-rows:1.5fr repeat(11,1fr) 1.5fr;max-width:min(100%,calc(100dvh - 16px));margin:auto}
.mid{grid-area:2/2/13/13;overflow:hidden}
.gm{display:block}
.bcol,.scol{min-width:0}
@media (min-width:900px){.gm{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}.scol .panel:first-child{margin-top:0}.ctl{position:sticky;top:8px;z-index:30}}
@media (max-width:899px){.ctl{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 6px);z-index:30;box-shadow:0 -4px 14px rgba(0,0,0,.28);max-height:52dvh;overflow:auto}}
.sq{cursor:pointer;font-size:clamp(4.5px,1.25vw,9px)}
.sq b{font-size:clamp(9px,2.6vw,20px)}
.sq small{font-size:clamp(5.5px,1.65vw,10px)}
.tk u{width:clamp(6px,2.1vw,13px);height:clamp(6px,2.1vw,13px)}
@media (max-width:640px){.sq span{display:none}.mid .t{font-size:clamp(14px,5vw,24px)}.dice{font-size:clamp(24px,8vw,46px)}.log{font-size:10px}}
.sq.own{box-shadow:inset 0 0 0 4px var(--oc)}
.sq.own::after{content:'';position:absolute;inset:0;background:var(--oc);opacity:.32;z-index:0;pointer-events:none}
.sq.free{box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.sq.mg{filter:grayscale(.9) brightness(.9)}
.ob,.fr{position:absolute;top:1px;right:1px;z-index:3;font-style:normal}
.ob{width:clamp(10px,3vw,19px);height:clamp(10px,3vw,19px);border-radius:50%;border:1.5px solid #fff;color:#fff;font-size:clamp(6px,1.9vw,12px);font-weight:800;display:flex;align-items:center;justify-content:center;text-shadow:none}
.fr{font-size:clamp(7px,2.1vw,13px)}
.hs{position:absolute;top:1px;left:1px;z-index:3;font-style:normal;font-size:clamp(5px,1.5vw,10px);line-height:1;max-width:60%;word-break:break-all}
.rt{color:#fff!important;border-radius:6px;padding:0 3px;text-shadow:none!important;font-weight:800}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;margin-top:6px;color:var(--mut)}
.lgd{display:inline-block;width:12px;height:12px;border-radius:3px;background:linear-gradient(90deg,#e63946,#1d6fd8);vertical-align:middle}
.pb{border-inline-start:6px solid var(--oc);padding:4px 8px;margin:6px 0;border-radius:8px;background:rgba(127,127,127,.08)}
.pb.turn{background:rgba(244,163,0,.22)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 4px}
.chip{font-size:11px;padding:3px 6px;border-radius:6px;border:1px solid var(--bd);border-inline-start:5px solid #888;background:var(--card);cursor:pointer}
.chip.sel{background:var(--ac);color:var(--btx)}
.pd{font-size:clamp(9px,2.5vw,13px);font-weight:600;color:var(--mut);line-height:1.5}
.ob2{display:inline-flex;width:18px;height:18px;border-radius:50%;color:#fff;align-items:center;justify-content:center;font-size:11px;font-weight:800;vertical-align:middle}
.tcol{border:1px dashed var(--bd);border-radius:10px;padding:6px;margin:6px 0;text-align:start}
.mid .pcard{max-width:96%}
/* ===== v4: obvious player tokens, group colours in every state, net worth, timer ===== */
.sq i.gb{position:absolute;top:0;left:0;width:100%;height:24%;min-height:5px;background:var(--gc,#888);border-bottom:2px solid #fff;z-index:2}
.sq.mg .ph{filter:grayscale(1)}
.sq.mg{filter:none}
.sq.own.mg::after{background:repeating-linear-gradient(45deg,var(--oc) 0 4px,#777 4px 8px);opacity:.45}
.sq.sg{outline:3px dashed var(--gc,var(--ac));outline-offset:-3px;z-index:6}
.sq.occ::before,.sq.here::before{content:'';position:absolute;inset:0;border:3px solid var(--hc);z-index:4;pointer-events:none}
.sq.here::before{border-width:4px;animation:hp 1s ease-in-out infinite}
@keyframes hp{50%{box-shadow:inset 0 0 12px 3px var(--hc);opacity:.55}}
.tk{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;align-content:center;gap:1px;z-index:5;pointer-events:none}
.tk u,.tok{display:inline-flex;align-items:center;justify-content:center;width:clamp(12px,3.6vw,22px);height:clamp(12px,3.6vw,22px);border-radius:50%;border:2px solid #fff;color:#fff;font-size:clamp(7px,2vw,12px);font-weight:900;font-style:normal;text-decoration:none;box-shadow:0 0 0 1.5px #000,0 2px 6px rgba(0,0,0,.5);vertical-align:middle}
.tok{width:20px;height:20px;font-size:11px;margin-inline-end:4px;flex:none}
@keyframes pl{50%{transform:scale(1.3)}}
.strip{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.pch{display:flex;align-items:center;flex-wrap:wrap;gap:2px;padding:4px 8px;border-radius:10px;border:2px solid var(--oc);background:var(--card);font-size:12px;cursor:pointer;flex:1 1 140px}
.pch small{flex-basis:100%;color:var(--mut);font-weight:600}
.pch.turn{background:rgba(244,163,0,.28);box-shadow:0 0 0 2px var(--oc)}
.pch.out{opacity:.5;flex:none}
.cd{font-variant-numeric:tabular-nums;font-weight:800;padding:0 6px;border-radius:6px;background:rgba(127,127,127,.2)}
.cd.warn{background:var(--ac);color:var(--btx);animation:hp 1s infinite}
.ctlh{font-size:13px;margin-bottom:2px}
.nwl{font-size:13px}
.nwl small{color:var(--mut)}
.gmem{display:inline-flex;align-items:center;font-size:11px;padding:3px 6px;border-radius:6px;border:2px solid var(--oc);border-top:5px solid var(--gc);background:var(--card);cursor:pointer}
.gmem.me{font-weight:800;background:rgba(244,163,0,.25)}
.gmem.mgd{opacity:.65;text-decoration:line-through}
.panel.dc{background:#ffe3e3;border-color:var(--ac);color:#2b2200}
/* ===== v5: click-to-highlight, host crown ===== */
.lnk{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;font-weight:700}
.pcard{cursor:pointer}
.sq.hl{animation:hlp 3s ease-in-out;z-index:9}
@keyframes hlp{0%,100%{transform:scale(1);box-shadow:none}10%,50%,90%{transform:scale(1.55);box-shadow:0 0 0 4px #ffd400,0 0 26px 10px #ffd400}30%,70%{transform:scale(1.25);box-shadow:0 0 0 3px #fff,0 0 14px 5px #ffd400}}
/* ===== v6: roll-off panel, language button ===== */
.dsm{font-size:26px;display:inline-block;vertical-align:middle;letter-spacing:3px}
.dsm.wait{opacity:.28;filter:grayscale(1)}
.dsm.roll{animation:roll .8s cubic-bezier(.2,.8,.3,1)}
.dsm.land{animation:roLand .4s cubic-bezier(.2,1.5,.35,1)}
@keyframes roLand{0%{transform:scale(.5) rotate(-35deg);opacity:.3}55%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.panel.ro .pl{gap:6px;border-radius:8px;padding:3px 6px}
.panel.ro .pl.rolling{background:rgba(200,16,46,.14);box-shadow:inset 0 0 0 2px var(--ac)}
#lg{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);inset-inline-start:92px;padding:4px 10px;margin:0;min-height:0;z-index:40}

/* ============================================================
   v7 — UI/UX polish: typography, depth, readability, touch
   (visual only — keeps every class name the game logic uses)
   ============================================================ */
:root{
  --edge:rgba(127,127,127,.35);
  --sh-sm:0 1px 2px rgba(0,0,0,.08),0 2px 8px rgba(0,0,0,.08);
  --sh-md:0 8px 22px rgba(0,0,0,.12);
  --sh-lg:0 18px 40px rgba(0,0,0,.20);
}
body{
  font-family:'Cairo',system-ui,'Segoe UI',Tahoma,Arial,sans-serif;
  background:radial-gradient(1100px 520px at 50% -10%, rgba(255,255,255,.5), rgba(255,255,255,0) 60%), var(--bg);
  background-attachment:fixed;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) body{background:radial-gradient(1100px 520px at 50% -10%, rgba(255,190,90,.10), rgba(255,255,255,0) 60%),var(--bg)}
}
:root[data-theme="dark"] body{background:radial-gradient(1100px 520px at 50% -10%, rgba(255,190,90,.10), rgba(255,255,255,0) 60%),var(--bg)}
h1{font-size:clamp(1.25rem,4.6vw,1.9rem)}
.hero{border-radius:18px;box-shadow:var(--sh-lg)}
.panel{border-radius:18px;border:1.5px solid var(--edge);padding:12px;margin-top:12px;box-shadow:var(--sh-md)}
@media (max-width:899px){.panel.ctl{box-shadow:0 -6px 22px rgba(0,0,0,.22)}}
button{
  border-radius:14px;padding:11px 18px;
  background:var(--btn);
  background:linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,0) 55%), var(--btn);
  box-shadow:0 3px 0 rgba(0,0,0,.26), 0 7px 16px rgba(0,0,0,.16);
  transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
}
button:hover{filter:brightness(1.06)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.26), 0 3px 8px rgba(0,0,0,.16)}
button.s{background:var(--card);color:var(--tx);border:1.5px solid var(--edge);box-shadow:var(--sh-sm)}
button.s:hover{background:rgba(127,127,127,.14)}
button:disabled{opacity:.45;box-shadow:none;filter:grayscale(.3)}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
input{border-radius:12px;border:1.5px solid var(--edge);transition:border-color .12s ease, box-shadow .12s ease}
input:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(200,16,46,.22)}
.board{border-radius:18px;border:3px solid var(--bd);gap:2px;overflow:hidden;box-shadow:var(--sh-lg)}
.sq{
  border-radius:6px;border:1px solid var(--edge);
  background:var(--card);
  background:linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0) 55%), var(--card);
  transition:filter .12s ease, box-shadow .12s ease;
}
.sq[data-i="0"]{border-top-left-radius:18px}
.sq[data-i="12"]{border-top-right-radius:18px}
.sq[data-i="24"]{border-bottom-left-radius:18px}
.sq[data-i="36"]{border-bottom-right-radius:18px}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .sq{background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,0) 55%),var(--card)}
}
:root[data-theme="dark"] .sq{background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,0) 55%),var(--card)}
@media (hover:hover){.sq:hover{filter:brightness(1.08);box-shadow:inset 0 0 0 2px var(--ac);z-index:6}}
.sq b{filter:drop-shadow(0 1px 1px rgba(0,0,0,.28))}
.sq i.gb{border-radius:6px 6px 0 0}
.mid{border-radius:14px;gap:9px;padding:10px}
.dice,.dsm{filter:drop-shadow(0 5px 10px rgba(0,0,0,.28))}
.log{line-height:1.35;background:rgba(127,127,127,.10);border-radius:10px;padding:4px 9px;max-width:96%}
.cd{background:rgba(127,127,127,.18);padding:2px 10px;border-radius:999px}
.cd.warn{background:var(--ac);color:var(--btx)}
.strip{gap:8px}
.pch{border-radius:14px;box-shadow:var(--sh-sm);transition:transform .12s ease, box-shadow .12s ease}
.pch:hover{transform:translateY(-1px)}
.pch.turn{box-shadow:0 0 0 3px var(--oc), 0 10px 20px rgba(0,0,0,.18)}
.pb{border-radius:12px;padding:8px 10px}
.chip{border-radius:10px;transition:transform .12s ease, background .12s ease}
.chip:hover{transform:translateY(-1px)}
.gmem{border-radius:10px;transition:transform .12s ease}
.gmem:hover{transform:translateY(-1px)}
.pcard{border-radius:14px;padding:6px;transition:background .12s ease}
.pcard:hover{background:rgba(127,127,127,.09)}
.pcard img{border-radius:12px}
.tcol{border-radius:14px}

/* ============================================================
   v8 — richer visuals: themed backdrop, app bar, hero, avatars,
   gold board frame, dice tray, turn spotlight
   ============================================================ */
body{isolation:isolate}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:
    radial-gradient(circle at 50% 50%, rgba(200,16,46,.07) 0 1.6px, transparent 2.4px),
    radial-gradient(circle at 0 0, rgba(244,163,0,.07) 0 1.6px, transparent 2.4px);
  background-size:34px 34px, 34px 34px;
  background-position:0 0, 17px 17px;
}
/* ---- app bar ---- */
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:8px;
  margin:-8px -8px 12px;
  padding:calc(env(safe-area-inset-top,0px) + 9px) 12px 9px;
  background:rgba(255,253,240,.85);
  -webkit-backdrop-filter:saturate(1.5) blur(10px);
  backdrop-filter:saturate(1.5) blur(10px);
  border-bottom:1px solid var(--edge);
  box-shadow:0 3px 16px rgba(0,0,0,.10);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .topbar{background:rgba(38,34,14,.85)}}
:root[data-theme="dark"] .topbar{background:rgba(38,34,14,.85)}
.topbar h1{margin:0;margin-inline-end:auto;font-size:clamp(1.05rem,3.8vw,1.55rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
.topbar-actions{display:flex;align-items:center;gap:6px;flex:none}
.iconbtn{
  width:40px;height:40px;min-height:0;padding:0;border-radius:12px;font-size:18px;
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--card);color:var(--tx);border:1px solid var(--edge);box-shadow:var(--sh-sm);
}
.iconbtn:hover{background:rgba(127,127,127,.14)}
#lg{position:static;inset:auto;margin:0;min-height:40px;height:40px;padding:0 14px;border-radius:12px;font-size:14px;box-shadow:var(--sh-sm)}
.np{max-width:30vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--mut)}
@media (max-width:700px){.np{display:none}}
@media (min-width:900px){.ctl{position:sticky;top:74px;z-index:30}}
/* ---- gold board frame ---- */
.board{
  border:3px solid transparent;
  background:

function endAuction(s){const a=s.au;s.au=null;s.ph='end';

<script type="module">
/* ============================================================================
   Discord + relay client
   ----------------------------------------------------------------------------
   • Discord Embedded App SDK: activity handshake, the "in the call" lobby bar,
     input focus, and (fallback) a channel-derived room.
   • State / presence / emotes / time are synchronised through the self-hosted
     relay (server.js) over a WebSocket. No Firebase, no third-party requests.
   ========================================================================== */
const DISCORD_CLIENT_ID = ""; // <-- paste your Discord Application ID (or use ?client_id=)
const qp = new URLSearchParams(location.search);
const inDiscord = qp.has("frame_id") || qp.has("instance_id");

// restore the state shape the game expects (arrays/objects survive JSON, but
// keep this so behaviour matches the previous Firebase implementation)
const arr = x => Array.isArray(x) ? x.filter(y => y != null) : Object.values(x || {});
const mp = m => { const o = {}; for (const k in (m || {})) if (m[k] != null) o[k] = m[k]; return o; };
const norm = v => {
  if (!v) return null;
  return { ...v, P: arr(v.P), O: mp(v.O), V: mp(v.V), H: mp(v.H), M: mp(v.M), log: arr(v.log),
    d: v.d || [1, 1], cfg: v.cfg || '',
    ro: v.ro ? { frames: arr(v.ro.frames), res: mp(v.ro.res), order: arr(v.ro.order), done: !!v.ro.done } : null,
    au: v.au ? { ...v.au, pass: arr(v.au.pass) } : null,
    tr: v.tr ? { ...v.tr, gp: arr(v.tr.gp), wp: arr(v.tr.wp) } : null };
};

const uid = "u" + Math.random().toString(36).slice(2, 10);

/* ---- lobby bar: who is in the Discord call (from the SDK) ---- */
function renderParticipants(list) {
  const el = document.getElementById("dcppl");
  if (!el) return;
  el.textContent = "";
  if (!list || !list.length) { el.hidden = true; return; }
  el.hidden = false;
  const b = document.createElement("b");
  b.textContent = document.documentElement.lang === "ar" ? "🎮 في المكالمة" : "🎮 In call";
  el.appendChild(b);
  for (const u of list) {
    const s = document.createElement("span"); s.className = "pc";
    const dot = document.createElement("i"); dot.className = "dot";
    s.appendChild(dot);
    s.appendChild(document.createTextNode(" " + (u.global_name || u.username || "?")));
    el.appendChild(s);
  }
}
function setupDiscordUI(sdk) {
  const grab = () => { try { window.focus(); } catch (e) {} };
  document.addEventListener("pointerdown", grab, true);
  document.addEventListener("mousedown", grab, true);
  document.addEventListener("touchend", grab, true);
  document.addEventListener("keydown", () => { if (!document.hasFocus()) grab(); }, true);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) setTimeout(grab, 60); });
  window.addEventListener("load", () => setTimeout(grab, 140));
  const refresh = async () => {
    try { const r = await sdk.commands.getActivityInstanceConnectedParticipants(); renderParticipants(r.participants || []); } catch (e) {}
  };
  try { sdk.subscribe("ACTIVITY_INSTANCE_PARTICIPANTS_UPDATE", p => renderParticipants(p.participants || [])); } catch (e) {}
  refresh();
}
async function setupSdk() {
  if (!inDiscord) return null;
  try {
    const mod = await import("./vendor/discord-sdk.js");
    const DiscordSDK = mod.DiscordSDK || (mod.default && mod.default.DiscordSDK);
    const clientId = qp.get("client_id") || DISCORD_CLIENT_ID;
    if (!clientId) return null;
    const sdk = new DiscordSDK(clientId);
    await Promise.race([sdk.ready(), new Promise((_, rej) => setTimeout(() => rej(new Error("sdk timeout")), 4000))]);
    window.__DISCORD_SDK = sdk;
    setupDiscordUI(sdk);
    return sdk;
  } catch (e) { console.warn("[discord]", (e && e.message) || e); return null; }
}

/* ---- WebSocket relay wiring ---- */
let ws = null, gotInit = false, buffered = null, resolved = false;
let snapshotCb = null, errCb = null, emoteCb = null, pending = null;

function connectRelay(room) {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const url = proto + "://" + location.host + "/ws?room=" + encodeURIComponent(room);
  ws = new WebSocket(url);
  ws.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.t === "init") {
      buffered = m.state; gotInit = true;
      if (m.ts) window.SVOFF = m.ts - Date.now();
      if (snapshotCb) snapshotCb(buffered ? { exists: true, data: () => norm(buffered) } : { exists: false, data: () => null });
      maybeResolve();
    } else if (m.t === "state") {
      buffered = m.state; gotInit = true;
      if (snapshotCb) snapshotCb({ exists: true, data: () => norm(m.state) });
    } else if (m.t === "pres") {
      if (window.onPres) window.onPres(m.users || {});
    } else if (m.t === "ack") {
      if (pending) { const p = pending; pending = null; p.resolve(); }
    } else if (m.t === "reject") {
      if (pending) { const p = pending; pending = null; p.reject(new Error("conflict")); }
    } else if (m.t === "emote") {
      if (emoteCb) emoteCb(m.e);
    } else if (m.t === "pong") {
      if (m.ts) window.SVOFF = m.ts - Date.now();
    }
  };
  ws.onclose = () => {
    if (errCb) { try { errCb(); } catch (e) {} }
    if (pending) { const p = pending; pending = null; p.reject(new Error("offline")); }
    setTimeout(() => connectRelay(room), 1500); // reconnect; server re-sends init
  };
  ws.onerror = () => {};
}
function maybeResolve() {
  if (resolved || !gotInit) return;
  resolved = true;
  const ref = {
    // optimistic concurrency: the relay only accepts the expected next version
    set: s => new Promise((resolve, reject) => {
      if (!ws || ws.readyState !== 1) { reject(new Error("offline")); return; }
      pending = { resolve, reject };
      ws.send(JSON.stringify({ t: "set", v: s.v, state: s }));
    }),
    onSnapshot: (cb, eb) => {
      snapshotCb = cb; errCb = eb;
      if (gotInit) { const b = buffered; snapshotCb(b ? { exists: true, data: () => norm(b) } : { exists: false, data: () => null }); }
    },
    emote: p => { try { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: "emote", e: p })); } catch (e) {} },
    onEmote: cb => { emoteCb = cb; },
  };
  window.netResolve({ uid, ref });
}

(async () => {
  // no Discord and no explicit room → single-device (local) mode
  if (!inDiscord && !qp.get("room") && !qp.get("instance_id")) { window.netResolve(null); return; }

  const sdkPromise = setupSdk();
  let room = qp.get("room") || null;
  if (!room) {
    const sdk = await Promise.race([sdkPromise, new Promise(r => setTimeout(() => r(null), 4500))]);
    if (sdk && sdk.channelId) room = "ch_" + sdk.channelId;
    else room = qp.get("instance_id") || "lobby";
  }
  window.ROOM = room;
  connectRelay(room);
})();
